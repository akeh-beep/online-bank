<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transfer Money</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<!-- =========================================
     MOBILE HEADER
========================================= -->

<header class="mobile-header">

    <div class="mobile-logo">
        <span>🏦</span>
        <strong>NOVA BANK</strong>
    </div>

   <div class="mobile-profile">

    <img
        id="mobile-profile-image"
        class="mobile-profile-image"
        src="default-profile.png"
        alt="Profile"
    >

    <span id="mobile-profile-name"></span>

</div>
</header>


<!-- =========================================
     SIDEBAR
========================================= -->

<aside class="sidebar">

    <div class="sidebar-logo">

        <span>🏦</span>

        <h2>NOVA BANK</h2>

    </div>

    <ul>

        <li>
            <a href="dashboard.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="#">
                💳 My Accounts
            </a>
        </li>

        <li>
            <a href="#">
                💳 My Cards
            </a>
        </li>

        <li class="active">
            <a href="transfer.html">
                💸 Transfer
            </a>
        </li>

        <li>
            <a href="#">
                💰 Payments
            </a>
        </li>

        <li>
            <a
                href="#"
                onclick="logout()"
            >
                🚪 Logout
            </a>
        </li>

    </ul>

</aside>


<!-- =========================================
     MAIN CONTENT
========================================= -->

<main class="content">


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <div class="topbar">

        <div>

            <h1>
                Transfer Money
            </h1>

            <p>
                Send money securely
            </p>

        </div>


        <div class="profile">

            <span id="profile-name"></span>

        </div>

    </div>


    <!-- =====================================
         TRANSFER CARD
    ====================================== -->

    <section class="card transfer-card">

        <h2>
            Transfer Money
        </h2>


        <!-- FROM ACCOUNT -->

        <div class="sender-box">

            <h3>
                From Account
            </h3>


            <div class="account-info-row">

                <span>
                    Name
                </span>

                <strong id="sender-name">
                    Loading...
                </strong>

            </div>


            <div class="account-info-row">

                <span>
                    Account Number
                </span>

                <strong id="sender-account">
                    Loading...
                </strong>

            </div>


            <div class="account-info-row">

                <span>
                    Available Balance
                </span>

                <strong id="sender-balance">
                    $0.00
                </strong>

            </div>

        </div>


        <div class="transfer-divider"></div>


        <!-- RECIPIENT -->

        <div class="form-group">

            <label for="recipient">
                Recipient Account Number
            </label>

            <input
                type="text"
                id="recipient"
                placeholder="Enter account number"
                autocomplete="off"
                onkeyup="checkRecipient()"
            >

            <p
                id="recipient-name"
                class="recipient-status"
            ></p>

        </div>


        <!-- AMOUNT -->

        <div class="form-group">

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="0"
                step="0.01"
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="description">
                Description
            </label>

            <input
                type="text"
                id="description"
                placeholder="What's this transfer for?"
            >

        </div>


        <!-- BUTTON -->

        <button
            type="button"
            class="transfer-submit"
            onclick="transferMoney()"
        >
            Send Money
        </button>


    </section>


</main>


<!-- =========================================
     MOBILE BOTTOM NAVIGATION
========================================= -->

<nav class="mobile-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >

        <span>
            🏠
        </span>

        <small>
            Home
        </small>

    </a>


    <a
        href="transfer.html"
        class="nav-item active"
    >

        <span>
            💸
        </span>

        <small>
            Transfer
        </small>

    </a>


    <a
        href="dashboard.html#transactions-section"
        class="nav-item"
    >

        <span>
            📊
        </span>

        <small>
            History
        </small>

    </a>


    <button
        type="button"
        class="nav-item"
    >

        <span>
            👤
        </span>

        <small>
            Profile
        </small>

    </button>

</nav>


<script src="/transfer.js"></script>

</body>

</html>
